<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <title>Fisc36</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <link rel="icon" type="image/png" href="/pwa-calculator-test/favicon.png">
    <link rel="apple-touch-icon" href="/pwa-calculator-test/icon-ios.png">

    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Use of pico CSS -->
    <link rel="stylesheet" href="/pwa-calculator-test/pico.cyan.min.css">
    <!-- Downsize standard pico CSS style -->
    <script type="module" crossorigin src="/pwa-calculator-test/assets/index-y7Uh2MGf.js"></script>
    <link rel="stylesheet" crossorigin href="/pwa-calculator-test/assets/index-CFBuVsp0.css">
  <link rel="manifest" href="/pwa-calculator-test/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/pwa-calculator-test/registerSW.js"></script></head>
  <body>
    <main class="container" style="max-width: 300px;">
      <!-- Navigation -->
      <nav>
        <h1 i18n-id="title">Fisc36</h1>
        <!-- Language selector -->
        <select id="languageSelect" aria-label="Select language" style="max-width: 78px;">
          <option value="fr">FR</option>
          <option value="nl">NL</option>
        </select>
      </nav>
      <p i18n-id="intro"></p>
      <hr>
      <!-- Form -->
      <form id="fiscForm">
        <label>
          <span i18n-id="lbl_fiscal_year"></span>
          <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
          <select id="fiscalYear" required>
            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
            <option>2023</option>
            <option>2022</option>
            <option>2021</option>
            <option>2020</option>
            <option>2019</option>
            <option>2018</option>
            <option>2017</option>
            <option>2016</option>
            <option>2015</option>
            <option>2014</option>
            <option>2013</option>
          </select>
          <small>
            <span aria-hidden="true" style="color: var(--pico-primary);">*</span> 
            <span i18n-id="small_required_field"></span>
          </small>
        </label>
        <label>
          <span i18n-id="lbl_catalog_value"></span>
          <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
          <input id="catalogValue" type="number" step="any" min="0" placeholder="0,00" required>
        </label>
        <label>
          <span i18n-id="lbl_first_reg"></span>
          <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
          <input id="registrationDate" type="date" required>
        </label>
        <label>
          <span i18n-id="lbl_motor"></span>
          <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
          <select id="motor">
            <option i18n-id="petrol"></option>
            <option i18n-id="lpg"></option>
            <option i18n-id="gas"></option>
            <option i18n-id="diesel"></option>
            <option i18n-id="electric"></option>
          </select>
          <small>
            <span i18n-id="small_hybrid"></span>
          </small>
        </label>
        <label>
          <span i18n-id="lbl_co2"></span>
          <input id="co2" type="number" min="0" placeholder="0">
          <small>
            <span i18n-id="small_false_hybrid"></span>
            <a id="false_hybrid_link"><span i18n-id="small_false_hybrid_link_text"></span></a>
          </small>
        </label>
        <label>
          <span i18n-id="lbl_first_day"></span>
          <input id="firstDayAtDisposal" type="date">
        </label>
        <label>
          <span i18n-id="lbl_last_day"></span>
          <input id="lastDayAtDisposal" type="date">
        </label>
        
        <button i18n-id="btn_calculate" type="submit"></button>
      </form>
      <output id="result" hidden>
        <p id="result-text" style="white-space: pre-line;"></p>
        <button id="btn_share_result">Share result</button>
      </output>
      <hr>
      <small>
        <span i18n-id="small_footnote_created_by"></span>
        <a href='https://www.linkedin.com/in/johan-oreel'>Johan Oreel</a>
        <span i18n-id="small_footnote_based_on"></span>
        <a id="doc_link"><span i18n-id="small_footnote_official_doc"></span></a>.
        <span i18n-id="small_footnote_source_code"></span>
        <!-- Share this link when the project is moved to another Github page -->
        <a href='https://github.com/Joreel/pwa-calculator-test'>Github</a>.
      </small>
    </main>
    
  </body>
</html>
