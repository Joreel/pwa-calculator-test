<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fisc36</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/icon-ios.png">

  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Use of pico CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.cyan.min.css">
  <!-- Downsize standard pico CSS style -->
  <link rel="stylesheet" href="downsize.css">
</head>
<body>
  <main class="container" style="max-width: 300px;">
    <!-- Navigation -->
    <nav>
      <h1 i18n-id="title">Fisc36</h1>
      <!-- Language selector -->
      <select id="languageSelect" aria-label="Select language" style="max-width: 78px;">
        <option value="fr">FR</option>
        <option value="nl">NL</option>
      </select>
    </nav>
    <p i18n-id="intro"></p>
    <hr>
    <!-- Form -->
    <form id="fiscForm">
      <label>
        <span i18n-id="lbl_fiscal_year"></span>
        <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
        <select>
          <option>2025</option>
          <option>2024</option>
        </select>
        <small>
          <span aria-hidden="true" style="color: var(--pico-primary);">*</span> 
          <span i18n-id="small_required_field"></span>
        </small>
      </label>
      <label>
        <span i18n-id="lbl_catalog_value"></span>
        <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
        <input type="number" id="catalogValue" placeholder="0,00" required>
      </label>
      <label>
        <span i18n-id="lbl_first_reg"></span>
        <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
        <input type="date" required>
      </label>
      <label>
        <span i18n-id="lbl_engine"></span>
        <span aria-hidden="true" style="color: var(--pico-primary);">*</span>
        <select id="engineType">
          <option i18n-id="petrol"></option>
          <option i18n-id="diesel"></option>
          <option i18n-id="electric"></option>
        </select>
      </label>
      <label>
        <span i18n-id="lbl_co2"></span>
        <input type="number" id="co2" placeholder="0">
      </label>
      <label>
        <span i18n-id="lbl_first_day"></span>
        <input type="date">
      </label>
      <label>
        <span i18n-id="lbl_last_day"></span>
        <input type="date">
      </label>
      
      <button i18n-id="btn_calculate" type="submit"></button>
    </form>
    <output id="result" hidden>
      <p id="result-text"></p>
      <button id="btn_share_result">Share result</button>
    </output>
    <hr>
    <small>
      <span i18n-id="small_footnote_created_by"></span>
      <a href='https://www.linkedin.com/in/johan-oreel'>Johan Oreel</a>
      <span i18n-id="small_footnote_based_on"></span>
      <a id="doc_link"><span i18n-id="small_footnote_official_doc"></span></a>.
      <span i18n-id="small_footnote_source_code"></span>
      <!-- Share this link when the project is moved to another Github page -->
      <a href='https://github.com/Joreel/pwa-calculator-test'>Github</a>.
    </small>
  </main>
  
  <!-- Translations with i18next -->
  <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  <script src="https://unpkg.com/i18next-browser-languagedetector/dist/umd/i18nextBrowserLanguageDetector.min.js"></script>
  <script src="lang.js"></script>

  <!-- Actual calculation -->
  <script src="app.js"></script>

  <!-- Service Worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log("Service Worker registered"));
    }
  </script>

</body>
</html>
